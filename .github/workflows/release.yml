name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish the packaged extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the current version
        id: version
        run: echo "current=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the package version
        if: github.ref_type == 'tag'
        env:
          REF: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          if [ "$REF" != "v$VERSION" ]; then
            echo "Tag $REF does not match package.json version v$VERSION."
            exit 1
          fi

      - name: Check whether this version is already released
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already has a GitHub Release; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.published.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.published.outputs.exists == 'false'
        run: npm ci

      - name: Verify the release candidate
        if: steps.published.outputs.exists == 'false'
        run: |
          npm run lint
          npm run typecheck
          npm run check:version
          npm run test

      - name: Package the extension
        if: steps.published.outputs.exists == 'false'
        run: npm run build

      - name: Publish the GitHub release
        if: steps.published.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            dist/*.zip
