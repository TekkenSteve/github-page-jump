name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Verify version synchronization
        run: npm run check:version

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Package
        run: npm run build

      - name: Upload the packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: github-page-jump
          path: dist/*.zip
          if-no-files-found: error
